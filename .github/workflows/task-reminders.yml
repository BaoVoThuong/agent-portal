name: Task reminders cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the overdue/reminder cron endpoint
        env:
          TASK_CRON_SECRET: ${{ secrets.TASK_CRON_SECRET }}
          TASK_CRON_URL: ${{ secrets.TASK_CRON_URL }}
        run: |
          if [ -z "$TASK_CRON_SECRET" ]; then
            echo "Missing GitHub secret: TASK_CRON_SECRET"
            exit 1
          fi

          if [ -z "$TASK_CRON_URL" ]; then
            echo "Missing GitHub secret: TASK_CRON_URL"
            exit 1
          fi

          # Deliberately NOT using --fail. With --fail curl exits 22 and throws
          # the response body away, so a 500 shows up in Actions as nothing but
          # "exit code 22" — which is how this cron failed for five hours on
          # 2026-08-16 with nobody able to see why. The route returns its reason
          # in the body ({"error": "..."}), so capture the body, print it, and
          # decide the exit status ourselves.
          response=$(curl --show-error --silent --retry 2 --max-time 60 \
            -w '\n%{http_code}' \
            -X GET \
            -H "Authorization: Bearer $TASK_CRON_SECRET" \
            "$TASK_CRON_URL")

          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          echo "HTTP $status"
          echo "Response body:"
          echo "$body"

          if [ -z "$status" ] || [ "$status" -ge 400 ] 2>/dev/null; then
            echo "::error::Cron endpoint returned HTTP ${status:-<none>}"
            exit 1
          fi
